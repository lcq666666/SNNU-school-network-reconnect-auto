[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snnu-campus-reconnect"
#: 与 campus_core.__version__ 保持一致（由 tests/unit/test_f22_build.py 校验）。
version = "0.4.0"
description = "陕西师范大学校园网自动重连助手（CLI + 托盘），Windows 10/11 x64"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lcq666666" }]
# 支持矩阵：Python 3.10+ / Windows 10、11 x64（依赖 winreg / ctypes / tkinter）。
classifiers = [
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# ---- 运行依赖（CLI 核心；与 requirements.txt 对齐）----
dependencies = [
    "requests>=2.31,<3",
    "keyring>=24,<26",
]

[project.optional-dependencies]
# 托盘附加依赖（tkinter 为官方 Python 自带，不在此列）
tray = [
    "pystray>=0.19,<0.20",
    "pillow>=10,<12",
]
# 开发 / 测试 / 静态检查
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<0.15",
]
# 打包
pack = [
    "pyinstaller>=6,<7",
]

[project.urls]
Repository = "https://github.com/lcq666666/SNNU-school-network-reconnect-auto"

[tool.setuptools]
# 本项目不是包，而是 4 个顶层模块（源码模式直接以脚本运行）。
py-modules = ["campus_reconnect", "campus_core", "campus_windows",
              "campus_reconnect_tray"]

# 说明：静态检查配置以仓库根 `ruff.toml` 为准，测试配置以 `pytest.ini` 为准
# （避免同一份配置存在两个来源而产生分叉，F22）。
