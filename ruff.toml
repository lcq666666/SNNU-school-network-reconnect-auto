# ruff 静态检查配置（阶段 1）
# 依据《修复开发计划》任务 1.5「配置 ruff check」。
# 运行：.venv/Scripts/ruff.exe check .
target-version = "py310"
line-length = 100

exclude = [".venv", "build", "dist", "logs", "__pycache__"]

[lint]
# 默认规则集（E4/E7/E9/F）足够覆盖未使用导入/未定义名等基础缺陷；
# 更严格的规则集在阶段 4（F22）按需扩展。
select = ["E4", "E7", "E9", "F", "W"]
