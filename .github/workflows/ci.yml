# CI：Windows 离线测试 + ruff + 受控构建（F22 / T34）
#
# 设计约定（与 README「CI 与发布」一节、pyproject.toml 支持矩阵一致）：
# - 默认权限只读（contents: read），CI 内**不得**提权；
# - 全部第三方 action 锁定到**不可变 commit SHA**（禁止浮动 tag）；
# - 依赖按 requirements-lock.txt 精确安装，保证可追溯重建；
# - 测试与静态检查各自独立步骤；构建统一走 tools/build_release.py，
#   不注入用户凭据、不上传日志 / 配置。
name: ci

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
  workflow_dispatch:

# 默认只读：CI 不写仓库内容（T34 权限断言）。
permissions:
  contents: read

jobs:
  test:
    name: offline tests + ruff (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Static checks (ruff)
        run: python -m ruff check .

      - name: Offline test suite
        run: python -m pytest

  build:
    name: controlled build (windows)
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      # 测试与 ruff 已在上游 job 单独执行，此处跳过以免重复。
      - name: Build release artifacts
        run: python tools/build_release.py --skip-checks

      - name: Upload build manifest
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: build-manifest
          path: |
            dist/build_info.json
            dist/CampusReconnect.exe.sha256
