[pytest]
# 阶段 1 测试配置：一条命令即可运行全部**默认离线测试**。
# 默认测试集合必须零真实网络 / 零真实注册表写入 / 零真实凭据读取 / 零真实浏览器启动。
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = -q -m "not regression"
markers =
    regression: 记录《审查方案》第 10 节已复现缺陷的回归用例；修复前必须失败，修复后转绿并移出该标记（用 `pytest -m regression` 单独运行）
